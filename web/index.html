<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2"><meta name="description" content="내 AI와 함께 챙기는 우리집 식탁. 냉장고부터 오늘의 요리까지, 우리집 셰프.">
  <title>우리집 셰프 · 내 AI와 챙기는 식탁</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-fridge" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M5 10h14M8 6v1m0 7v3"/></symbol>
    <symbol id="i-recipe" viewBox="0 0 24 24"><path d="M5 4h5a3 3 0 0 1 2 1 3 3 0 0 1 2-1h5v16h-5a3 3 0 0 0-2 1 3 3 0 0 0-2-1H5zM12 5v16M8 8h1m6 0h1M8 12h1m6 0h1"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 7h14l1 14H4zM8 8V6a4 4 0 0 1 8 0v2"/></symbol>
    <symbol id="i-family" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 4v3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11a8 8 0 0 1-8 8H6l-4 3 1-7a8 8 0 0 1-1-4 9 9 0 0 1 19 0Z"/><path d="M7 10h10m-10 4h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3c-1 9-1 16-9 16a7 7 0 0 1-7-7c0-8 8-7 16-9ZM4 21 15 10"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
  </defs></svg>
  <a class="skip" href="#main">본문으로 이동</a>
  <div class="app">
    <header class="header">
      <a href="#home" class="brand" aria-label="우리집 셰프 홈"><span class="brand-mark" aria-hidden="true">♧</span><span>우리집 셰프<small>내 AI와 챙기는 식탁</small></span></a>
      <div class="header-actions"><button class="demo-toggle" id="demo-toggle" aria-pressed="false">예시 보기 <span class="switch" aria-hidden="true"></span></button><button class="avatar" data-action="connection" aria-label="연결 상태와 설정">나</button></div>
    </header>
    <nav class="navigation" aria-label="주 메뉴">
      <a href="#home" data-nav="home"><svg><use href="#i-home"/></svg><span>홈</span></a>
      <a href="#fridge" data-nav="fridge"><svg><use href="#i-fridge"/></svg><span>내 냉장고</span></a>
      <a href="#recipes" data-nav="recipes"><svg><use href="#i-recipe"/></svg><span>레시피</span></a>
      <a href="#shopping" data-nav="shopping"><svg><use href="#i-bag"/></svg><span>장보기</span></a>
      <a href="#family" data-nav="family"><svg><use href="#i-family"/></svg><span>우리 가족</span></a>
    </nav>
    <main id="main" tabindex="-1">
      <div class="connection-banner"><span class="connection-dot"></span><p id="connection-copy">화면 연결 준비 중 · 내 기록은 AI 채팅에서 관리해요</p><button data-action="connection" aria-label="연결 상태 자세히 보기"><svg><use href="#i-info"/></svg></button></div>
      <div id="screen"></div>
      <footer class="footer"><span>먹는 즐거움은 당신에게.<br class="mobile-only"> 챙기는 일은 우리집 셰프와 함께.</span><button data-action="connection">연결·개인정보 안내 <span aria-hidden="true">↗</span></button></footer>
    </main>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-head"><span class="eyebrow" id="sheet-kicker">우리집 셰프</span><button class="icon-button" id="close-sheet" aria-label="닫기"><svg><use href="#i-close"/></svg></button></div><div id="sheet-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
